# Nothing but the import list, deliberately.
#
# Alacritty loads the importing file last and lets it replace anything its
# imports set. Any setting placed here would therefore be impossible to override
# from local.toml. Keeping this file empty of settings makes the order below
# mean what it looks like it means:
#
#   base.toml   shared settings, tracked
#   theme.toml  symlink managed by dot-theme-set
#   local.toml  per-machine overrides, git-ignored, wins
#
# theme.toml is applied after base.toml so a theme's colours win, and local.toml
# is last so this machine always has the final say.

[general]
import = [
  "~/.config/alacritty/base.toml",
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/local.toml",
]
